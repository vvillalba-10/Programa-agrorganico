<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AgrOrgánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .header-logo-text { font-family: 'Georgia', serif; font-size: 1.8rem; font-weight: bold; color: #ffffff; letter-spacing: 1px; }
        .navbar-nav .nav-link { color: #f8f9fa; font-weight: 400; font-size: 1rem; padding: 0.5rem 1rem; transition: color 0.3s ease; }
        .navbar-nav .nav-link:hover { color: #e0e0e0; }
        .form-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
        }
        .form-label {
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: #333;
        }
        .form-control {
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
        }
        .btn-login {
            background-color: #28a745;
            border-color: #28a745;
            color: #fff;
            border-radius: 5px;
            padding: 0.7rem 1.5rem;
            font-weight: 500;
        }
        .btn-login:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }
        .text-center a {
            color: #28a745;
            text-decoration: none;
        }
        .text-center a:hover {
            text-decoration: underline;
        }
        .mt-3 { margin-top: 1rem !important; }
        .mb-4 { margin-bottom: 2rem !important; }
        .error-message {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        .success-message {
            color: #28a745;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        .user-info { color: white; display: flex; align-items: center; }
        .user-info .username { margin-right: 15px; font-weight: 500; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="header-logo-text">AgrOrgánico</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="quienes_somos.html">Quiénes somos</a></li>
                    <li class="nav-item"><a class="nav-link" href="suelo.html">Suelo</a></li>
                    <li class="nav-item"><a class="nav-link" href="abonos.html">Abonos</a></li>
                    <li class="nav-item"><a class="nav-link" href="seguimiento.html">Seguimiento</a></li>
                </ul>
                <div class="d-flex ms-auto" id="auth-buttons">
                    <a href="login.html" class="btn btn-outline-light btn-sm me-2 active">Iniciar sesión</a>
                    <a href="registro.html" class="btn btn-light btn-sm">Registrarse</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="form-container">
            <h2 class="text-center text-success mb-4">Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo electrónico" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-login w-100 mt-3">Iniciar Sesión</button>
                <div id="loginError" class="error-message text-center" style="display:none;"></div>
                <div id="loginSuccess" class="success-message text-center" style="display:none;">¡Inicio de sesión exitoso! Redirigiendo...</div>
            </form>
            <p class="text-center mt-3">¿No tienes una cuenta? <a href="registro.html" class="text-success">Regístrate aquí</a></p>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2025 AgrOrgánico. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
       
        document.addEventListener('DOMContentLoaded', () => {
            const authButtons = document.getElementById('auth-buttons');
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                authButtons.innerHTML = `
                    <div class="user-info">
                        <span class="username">Hola, ${currentUser}</span>
                        <button id="logoutBtn" class="btn btn-light btn-sm">Cerrar sesión</button>
                    </div>
                `;
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    localStorage.removeItem('currentUser');
                    window.location.href = 'index.html';
                });
            } else {
                authButtons.innerHTML = `
                    <a href="login.html" class="btn btn-outline-light btn-sm me-2 active">Iniciar sesión</a>
                    <a href="registro.html" class="btn btn-light btn-sm">Registrarse</a>
                `;
            }
        });

      
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
           
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginSuccess').style.display = 'none';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
               
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    
                    localStorage.setItem('currentUser', result.nombre);
                    
                    document.getElementById('loginSuccess').innerHTML = result.mensaje;
                    document.getElementById('loginSuccess').style.display = 'block';
                    
                    
                    setTimeout(() => {
                        window.location.href = 'index.html'; 
                    }, 2000);
                } else {
                    
                    document.getElementById('loginError').innerHTML = result.error;
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (error) {
                console.error('Error al conectar:', error);
                document.getElementById('loginError').innerHTML = 'No se pudo conectar con el servidor backend.';
                document.getElementById('loginError').style.display = 'block';
            }
        });
    </script>
</body>
</html>
