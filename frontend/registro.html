<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AgrOrgánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .header-logo-text { font-family: 'Georgia', serif; font-size: 1.8rem; font-weight: bold; color: #ffffff; letter-spacing: 1px; }
        .navbar-nav .nav-link { color: #f8f9fa; font-weight: 400; font-size: 1rem; padding: 0.5rem 1rem; transition: color 0.3s ease; }
        .navbar-nav .nav-link:hover { color: #e0e0e0; }
        .form-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
        }
        .form-label { font-weight: 500; margin-bottom: 0.3rem; color: #333; }
        .form-control:focus { border-color: #28a745; box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25); }
        .btn-register { background-color: #28a745; border-color: #28a745; color: #fff; font-weight: 500; padding: 0.7rem 1.5rem; }
        .btn-register:hover { background-color: #218838; border-color: #1e7e34; }
        .text-center a { color: #28a745; text-decoration: none; }
        .text-center a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="header-logo-text">AgrOrgánico</span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="quienes_somos.html">Quiénes somos</a></li>
                    <li class="nav-item"><a class="nav-link" href="suelo.html">Suelo</a></li>
                    <li class="nav-item"><a class="nav-link" href="abonos.html">Abonos</a></li>
                    <li class="nav-item"><a class="nav-link" href="seguimiento.html">Seguimiento</a></li>
                </ul>
                <div class="d-flex ms-auto">
                    <a href="login.html" class="btn btn-outline-light btn-sm me-2">Iniciar sesión</a>
                    <a href="registro.html" class="btn btn-light btn-sm active">Registrarse</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="form-container">
            <h2 class="text-center text-success mb-4">Registro de Usuario</h2>
            <form id="registroForm">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo electrónico" required>
                </div>
                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-register w-100 mt-3">Registrarse</button>
            </form>
            <p class="text-center mt-3">¿Ya tienes una cuenta? <a href="login.html" class="text-success">Inicia sesión aquí</a></p>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 AgrOrgánico. Todos los derechos reservados.</p>
    </footer>

    <script>
        // LÓGICA EXCLUSIVA DE ENVÍO DE REGISTRO
        document.getElementById('registroForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const contrasena = document.getElementById('contrasena').value;

            try {
                const response = await fetch('http://localhost:3000/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, contrasena })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.mensaje); 
                    window.location.href = 'login.html'; // Redirige al login tras tener éxito
                } else {
                    alert(result.error); 
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un error al intentar conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
